name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build WadiHunt APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets
        run: |
          cd client
          npm run build

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android || echo "Capacitor sync finished"

      - name: Build Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=========================================="
            echo "           EXACT GRADLE ERROR             "
            echo "=========================================="
            grep -B 2 -A 25 -i "what went wrong" /tmp/gradle_output.txt || tail -n 50 /tmp/gradle_output.txt
            exit $EXIT_CODE
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wadihunt-debug-apk
          path: |
            client/android/app/build/outputs/apk/debug/*.apk
            client/android/app/build/outputs/**/*.apk
            **/*.apk
