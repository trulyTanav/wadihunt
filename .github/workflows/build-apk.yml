name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build WadiHunt APK
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || yes | sdkmanager --licenses || true

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Assets
        run: |
          cd client
          npm run build

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Sync Capacitor Android
        run: |
          cd client
          npx cap sync android || echo "Capacitor sync finished"

      - name: Build Debug APK
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log || (echo "### ❌ GRADLE BUILD FAILURE" >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY && echo '```' >> $GITHUB_STEP_SUMMARY && exit 1)

      - name: Upload Build Log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-build-log
          path: client/android/gradle-build.log

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wadihunt-debug-apk
          path: client/android/app/build/outputs/apk/debug/*.apk
