<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>WadiHunt — Real-World GPS Manhunt</title>
    <script>
      (function() {
        window.__BOOT_ERRORS__ = [];
        function recordError(msg) {
          window.__BOOT_ERRORS__.push(msg);
          var el = document.getElementById('boot-status');
          if (el) {
            el.innerHTML = '<span style="color:#FF2A55;word-break:break-all;font-size:11px;">BOOT FAULT: ' + msg + '</span>';
          }
        }
        window.addEventListener('error', function(e) {
          var msg = e.message || (e.error && e.error.message);
          if (!msg && e.target && (e.target.src || e.target.href)) {
            msg = 'Resource load failed: ' + (e.target.src || e.target.href);
          }
          recordError(msg || String(e));
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason ? (e.reason.message || String(e.reason)) : 'Promise rejected';
          recordError('Async Error: ' + reason);
        });
        setTimeout(function() {
          if (!window.__TACTICAL_MOUNTED__) {
            var el = document.getElementById('boot-status');
            if (el) {
              var loaded = window.__SCRIPT_LOADED__ ? 'Script Executed' : 'Script Pending';
              var errText = window.__BOOT_ERRORS__.length > 0 ? ('<br/>Faults: ' + window.__BOOT_ERRORS__.join('; ')) : '';
              el.innerHTML = '<span style="color:#FFB800;font-size:11px;">BOOT TIMEOUT (' + loaded + ')' + errText + '</span><br/><button onclick="window.location.reload()" style="margin-top:10px;padding:6px 14px;background:#7C4DFF;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:bold;cursor:pointer;">RETRY BOOT</button>';
            }
          }
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;height:100vh;height:100dvh;align-items:center;justify-content:center;background:#0B0914;color:#F4F1FF;font-family:sans-serif;flex-direction:column;gap:14px;text-align:center;padding:24px;">
        <img src="./favicon.png" alt="WadiHunt" style="width:58px;height:58px;border-radius:14px;box-shadow:0 0 20px rgba(255,42,85,0.4);border:1px solid rgba(255,42,85,0.4);" />
        <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;">Wadi<span style="color:#7C4DFF;">Hunt</span></div>
        <div id="boot-status" style="font-size:12px;color:#A39AC2;font-family:monospace;">INITIALIZING TACTICAL SYSTEM...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
