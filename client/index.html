<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0914" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>WadiHunt — Real-World GPS Manhunt</title>
  </head>
  <body>
    <div id="root">
      <div style="display:flex;height:100vh;height:100dvh;align-items:center;justify-content:center;background:#0B0914;color:#F4F1FF;font-family:sans-serif;flex-direction:column;gap:14px;text-align:center;padding:24px;">
        <div style="width:48px;height:48px;border-radius:12px;background:#7C4DFF;display:flex;align-items:center;justify-content:center;font-size:24px;">🎯</div>
        <div style="font-size:24px;font-weight:800;letter-spacing:-0.03em;">Wadi<span style="color:#7C4DFF;">Hunt</span></div>
        <div id="boot-status" style="font-size:12px;color:#A39AC2;font-family:monospace;">INITIALIZING TACTICAL SYSTEM...</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var el = document.getElementById('boot-status');
        if (el) {
          el.innerHTML = '<span style="color:#FF2A55;word-break:break-all;font-size:11px;">BOOT ERROR: ' + (e.message || (e.error && e.error.message) || e.toString()) + '</span>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        var el = document.getElementById('boot-status');
        if (el) {
          el.innerHTML = '<span style="color:#FF2A55;word-break:break-all;font-size:11px;">PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '</span>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
